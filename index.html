<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WS app | Weather Scientists</title>

  <!-- Leaflet CSS y estilos principales -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css?v=2026.10.23.7" />

  <!-- Scripts externos con defer para no bloquear el renderizado -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

  <!-- Scripts de la aplicación -->
  <script src="app.js?v=2026.10.23.7" defer></script>
  <script src="updates.js?v=2026.10.23.7" defer></script>
  <script src="/pwa.js?v=2026.10.23.7" defer></script>

  <!-- Configuración PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="theme-color" content="#083c70">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WS app">
</head>
<body>

  <aside id="update-banner" class="update-banner" hidden role="status" aria-live="polite">
    <div>
      <strong>✨ Hay una nueva versión de WS app</strong>
      <p>Envía tu registro pendiente antes de actualizar.</p>
    </div>
    <button type="button" id="btn-actualizar">Instalar actualización</button>
    <button type="button" id="btn-posponer" class="secondary">Más tarde</button>
  </aside>

  <header class="brand-header">
    <img class="brand-logo" src="logo.svg" alt="Weather Scientists Logo">
  </header>

  <main id="app-content">
    <!-- Contenido principal de la app -->
  </main>

</body>
</html>
